<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F1FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14111F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gro vs Vie">
<title>Groningen vs Vienna</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one app column with a bottom tab bar; the question card is the single focal object during play */
:root{
  --bg:#F3F1FA; --bg-2:#EAE7F4; --surface:#FFFFFF; --ink:#1E1A33; --ink-2:#5E5878; --ink-3:#8C87A6; --line:#DDD9EC;
  --p1:#E8662A; --p1-soft:#FDE6DA; --p2:#1B8F8A; --p2-soft:#D6F0EE;
  --good:#1F9D55; --bad:#D23C4B;
  --shadow:0 1px 2px rgba(30,26,51,.08),0 8px 22px rgba(30,26,51,.08);
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#14111F; --bg-2:#1A1628; --surface:#1F1B30; --ink:#EFECFA; --ink-2:#B9B3D1; --ink-3:#8A84A6; --line:#332D4B;
  --p1:#FF8A4F; --p1-soft:#3D2419; --p2:#3CC7BF; --p2-soft:#14332F;
  --good:#4FD18A; --bad:#FF6B78;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.page{max-width:680px;margin:0 auto;padding:20px 16px 120px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
h1{font-weight:800;letter-spacing:-.02em}
h2{font-weight:800;font-size:22px}
p{margin:0}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700}
:focus-visible{outline:3px solid var(--p2);outline-offset:2px}

.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 18px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink-2);min-width:0}
.field input{font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.field input:focus{outline:none;border-color:var(--ink)}
.status{font-size:14px;color:var(--ink-2);min-height:1.4em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:440px){.two{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-weight:500;padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:transparent}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{opacity:.65;margin-left:4px;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;width:max-content}
.seg button{border:none;background:transparent;padding:8px 16px;font-weight:700;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:500}
.toggle input{width:20px;height:20px;accent-color:var(--ink);flex:none}
.toggle.off{opacity:.5;cursor:default}
.setrow{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}

/* title */
.titlepage{padding:6px 0 0}
.titlepage .kicker{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--p1)}
.titlepage h1{font-size:clamp(34px,9vw,46px);margin-top:4px}
.titlepage h1 .a{color:var(--p1)}.titlepage h1 .b{color:var(--p2)}
.titlepage p{color:var(--ink-2);margin-top:6px}

/* home */
.tally{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.tally .side{display:flex;flex-direction:column;min-width:0}
.tally .side:last-child{text-align:right}
.tally .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tally .n{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.tally .mid{color:var(--ink-3);font-size:13px;text-align:center}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:440px){.tiles{grid-template-columns:1fr}}
.tile{border:0;text-align:left;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px;min-height:132px;justify-content:flex-end;position:relative;overflow:hidden}
.tile.main{background:var(--ink);color:var(--bg)}
.tile.alt{background:var(--surface);border:1px solid var(--line)}
.tile.main{grid-column:1/-1}
.tile.mys{background:linear-gradient(135deg,var(--p2),color-mix(in srgb,var(--p2) 55%,#1E1A33));color:#fff}
.tile.mys .glyph{opacity:.35}
.flag{font-size:clamp(84px,26vw,120px);line-height:1.05;text-align:center;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.rflag{margin-right:8px;font-size:22px;vertical-align:-2px}
.guessform{display:flex;gap:8px}
.guessform input{flex:1;min-width:0;font-size:17px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.guessform input:focus{outline:none;border-color:var(--p2)}
.guesses{display:flex;flex-direction:column;gap:8px}
.guess{display:grid;grid-template-columns:auto 1fr auto 28px;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);
  background:linear-gradient(90deg,color-mix(in srgb,var(--h) 26%,var(--surface)) var(--p),var(--surface) var(--p))}
.guess.hit{border-color:var(--good);border-width:2px}
.gflag{font-size:26px;line-height:1}
.gname{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gdist{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:14px}
.garrow{font-size:20px;font-weight:800;text-align:center;color:var(--ink)}
.gcount{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.reveal{align-items:center;text-align:center}
.tile.c-bd{background:linear-gradient(135deg,#2F6FD6,#1B3F86);color:#fff}
.tile.c-hl{background:linear-gradient(135deg,#7A4FD6,#45289A);color:#fff}
.tile.c-tl{background:linear-gradient(135deg,#C2582A,#7A2E14);color:#fff}
.tile.c-bd .glyph,.tile.c-hl .glyph,.tile.c-tl .glyph{opacity:.35}
.tile{min-height:120px}
.daily{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;border:0;border-radius:18px;padding:16px 18px;background:var(--p1);color:#fff;box-shadow:var(--shadow)}
.daily .label{color:rgba(255,255,255,.85)}
.daily b{font-family:var(--display);font-size:22px;font-weight:800;display:block}
.streak{display:flex;flex-direction:column;align-items:center;background:rgba(255,255,255,.2);border-radius:14px;padding:8px 14px;min-width:64px}
.streak b{font-size:26px;line-height:1}
.streak span{font-size:12px}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.node{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:15px}
.node .gflag{font-size:20px}
.node.end{border:2px solid var(--p2)}
.node.ghost{opacity:.6;border-style:dashed}
.link{color:var(--ink-3)}
.hlgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hlcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:22px 10px;border-radius:18px;border:2px solid var(--line);background:var(--surface);min-height:190px;text-align:center;color:var(--ink);min-width:0}
.hlcard:hover:not(:disabled){border-color:var(--p1)}
.hlcard:disabled{cursor:default}
.hlflag{font-size:clamp(48px,15vw,68px);line-height:1}
.hlcard b{font-family:var(--display);font-size:19px;overflow-wrap:anywhere}
.hlval{font-variant-numeric:tabular-nums;font-weight:700;min-height:1.4em;color:var(--ink-2)}
.hlcard.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.hlcard.dim{opacity:.75}
.hlcard.wrong{border-color:var(--bad);opacity:1}
.tl{display:flex;flex-direction:column;gap:10px}
.tlev{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;text-align:left;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:500;color:var(--ink)}
.tlev.set{border-color:var(--p1)}
.tlnum{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;background:var(--bg-2)}
.tlev.set .tlnum{background:var(--p1);color:#fff}
.tlev.done{grid-template-columns:72px 1fr 22px}
.tlev.done.ok{border-color:var(--good)}
.tlev.done.no{border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.tlyear{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums}
.tlev .ic{font-weight:800}.tlev.ok .ic{color:var(--good)}.tlev.no .ic{color:var(--bad)}
.tlrow{display:grid;grid-template-columns:66px 1fr auto;gap:10px;font-size:14px;align-items:baseline}
.tlmk{display:flex;gap:6px;font-weight:800}.okc{color:var(--good)}.noc{color:var(--bad)}
.betrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.betrow .chip:disabled{opacity:.5}
.betrow .chip[aria-pressed="true"]:disabled{opacity:1}
.tile b{font-family:var(--display);font-size:24px;font-weight:800;line-height:1.05}
.tile span{font-size:14px;opacity:.8}
.tile .glyph{position:absolute;right:14px;top:10px;font-family:var(--display);font-weight:800;font-size:56px;line-height:1;opacity:.18}
.sect{display:flex;flex-direction:column;gap:10px}
.sect h3{font-size:18px;font-weight:800}

/* duel rows */
.drow{width:100%;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left}
.drow:hover{border-color:var(--ink-3)}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;font-size:17px;background:var(--c,var(--p2))}
.dmain{flex:1;min-width:0;display:flex;flex-direction:column}
.dmain b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dmain small{color:var(--ink-3);font-size:13px}
.dstate{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-variant-numeric:tabular-nums;font-weight:700}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--bg-2);color:var(--ink-2)}
.pill.turn{background:var(--p1);color:#fff}
.pill.win{background:color-mix(in srgb,var(--good) 18%,var(--surface));color:var(--good)}
.pill.loss{background:color-mix(in srgb,var(--bad) 15%,var(--surface));color:var(--bad)}
.empty{color:var(--ink-3);font-size:15px;padding:6px 2px}

/* quiz */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.xbtn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:16px}
.board{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.pl{border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;border:2px solid transparent;transition:transform .2s,border-color .2s;min-width:0;background:color-mix(in srgb,var(--c) 16%,var(--surface))}
.pl.r{text-align:right}
.pl.on{border-color:var(--c);transform:translateY(-2px)}
.pl .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .sc{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;color:var(--c)}
.board .mid{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink-3);font-size:13px;text-align:center;font-variant-numeric:tabular-nums}
.board .mid b{font-family:var(--display);font-size:18px;color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--turn)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.turn{font-weight:700;color:var(--turn)}
.cat{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--bg);color:var(--ink-2)}
.q{font-family:var(--display);font-weight:500;font-size:clamp(21px,5vw,27px);line-height:1.25}
.timer{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--turn);transform-origin:left}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opt{text-align:left;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-weight:500;display:flex;gap:10px;align-items:baseline;min-width:0}
.opt .k{font-family:var(--display);font-weight:800;color:var(--ink-3)}
.opt:hover:not(:disabled){border-color:var(--turn)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.opt.dim{opacity:.5}
.qfoot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;min-height:46px}
.verdict{font-weight:700}
.verdict.good{color:var(--good)}.verdict.bad{color:var(--bad)}
.handoff{text-align:center;align-items:center;padding-block:40px}
.handoff .who{font-family:var(--display);font-weight:800;font-size:clamp(34px,10vw,50px)}

/* duel detail */
.banner{font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,40px);text-align:center}
.review{display:flex;flex-direction:column;gap:10px}
.rv{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.rv .qq{font-weight:600}
.rv .ans{font-size:14px;color:var(--ink-2)}
.rv .ans b{color:var(--good)}
.marks{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:14px}
.mk{display:flex;gap:6px;align-items:baseline;min-width:0;padding:6px 8px;border-radius:8px;background:var(--bg)}
.mk .ic{font-weight:800;flex:none}
.mk.ok .ic{color:var(--good)}.mk.no .ic{color:var(--bad)}
.mk span:last-child{min-width:0;overflow-wrap:anywhere}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:440px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:13px;color:var(--ink-3)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:110px 1fr 46px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:10px;border-radius:6px;background:var(--bg-2);overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--c,var(--p2));border-radius:6px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;background:var(--c)}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.qlist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.qlist li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:15px}
.qlist li span{min-width:0;overflow-wrap:anywhere}
.qlist li small{color:var(--ink-3)}
.x{border:none;background:none;color:var(--ink-3);font-size:18px;padding:4px 8px}
.who-list{display:flex;flex-direction:column;gap:10px}
.whobtn{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);font-weight:700;font-size:17px}
.whobtn[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface))}

/* tab bar, sheets, toast, pull to refresh */
#tabbar{display:none}
body.withtabs #tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);padding:6px max(4px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(4px,env(safe-area-inset-left));box-shadow:0 -4px 14px rgba(30,26,51,.06)}
#tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink-3);padding:4px 0}
#tabbar button[aria-current="page"]{color:var(--p1);font-weight:700}
#tabbar .ti{font-size:21px;line-height:1;position:relative}
#tabbar .ti b{position:absolute;top:-5px;right:-12px;background:var(--p1);color:#fff;border-radius:9px;font-size:10px;padding:1px 5px}
.scrim{position:fixed;inset:0;background:rgba(20,16,32,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;overscroll-behavior:contain;border-radius:18px 18px 0 0;padding:14px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.25);animation:rise .25s ease;display:flex;flex-direction:column;gap:16px;position:relative}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px}}
.sheetx{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:15px}
.sheet h2{padding-right:44px;font-size:26px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:90vw}
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 8px);z-index:70;transform:translate(-50%,-70px);width:44px;height:44px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--p1);font-size:22px;pointer-events:none}
.ptr.spin span{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- surprise ---------- */

/* Layout: a 3D stage centred on screen; the box is a real cube, the bouquet spirals up out of it, the note slides in below */
.giftroot{
  --bg:#EFE7DA; --bg-2:#FBF7F0; --ink:#1F2A3A; --ink-2:#8A7558; --paper:#FFFDF8; --line:#E3D6C0; --gold:#B8893A; --navy:#1F3A5F;
  --hand:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .28 0 0 0 0 .2 0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  --body:"Figtree",system-ui,-apple-system,sans-serif;
  --rib:linear-gradient(90deg,#9E7330,#F3DB9A 45%,#E2BE6A 60%,#9A6D28);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .giftroot{--bg:#14181F; --bg-2:#232A35; --ink:#F3EBDD; --ink-2:#C2AE8E; --line:#3A3A3A; color-scheme:dark}}
:root[data-theme="dark"] .giftroot{--bg:#14181F; --bg-2:#232A35; --ink:#F3EBDD; --ink-2:#C2AE8E; --line:#3A3A3A; color-scheme:dark}
.giftroot{position:fixed;inset:0;z-index:90;transition:opacity .5s ease;background:var(--grain),radial-gradient(70% 55% at 50% 38%,var(--bg-2),var(--bg) 75%);color:var(--ink);font-family:var(--body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gift{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px 16px}
.stage{position:relative;perspective:1000px;perspective-origin:50% 30%;cursor:pointer;outline:none;flex:none}
.stage:focus-visible{outline:2px solid var(--gold);outline-offset:8px;border-radius:20px}
.scene{position:absolute;left:50%;transform-style:preserve-3d}
.boxg,.lid,.bq{position:absolute;left:0;top:0;transform-style:preserve-3d}
.face{position:absolute;backface-visibility:visible}
.shadow{position:absolute;left:50%;border-radius:50%;background:radial-gradient(closest-side,rgba(30,30,40,.32),rgba(30,30,40,0));transform:translateX(-50%);transition:opacity .6s ease 1.4s}
.open .shadow{opacity:.35}
.boxg{transition:transform .9s cubic-bezier(.5,0,.8,.2)}
.boxg .face{transition:opacity .45s ease .35s}
.boxg.gone .face{opacity:0}
.stage:not(.open) .wob{animation:wob 3s ease-in-out infinite}
.wob{transform-style:preserve-3d;position:absolute;left:0;top:0}
@keyframes wob{0%,62%,100%{transform:rotateZ(0)}68%{transform:rotateZ(-3deg) translateY(-4px)}74%{transform:rotateZ(3deg)}80%{transform:rotateZ(-2deg)}86%{transform:rotateZ(1deg)}}
.lid{transition:transform 1s cubic-bezier(.2,.7,.3,1),opacity .5s ease .55s}
.bow{position:absolute;left:0;top:0;transform-style:preserve-3d}
.bow svg{position:absolute;display:block}
.bq svg{display:block;width:100%;height:100%;filter:drop-shadow(0 16px 22px rgba(40,30,15,.25))}
.bq{backface-visibility:visible}
.pl0,.pl1{position:absolute;inset:0}
.pl1{transform:rotateY(90deg)}

.bq{opacity:0}
.gletter{position:relative;background:var(--grain),var(--paper);color:#2A2420;border-radius:3px;padding:20px 28px 16px;box-shadow:0 1px 1px rgba(0,0,0,.04),0 14px 30px rgba(40,30,15,.16);
  transform:translateY(36px) rotate(-1.2deg);opacity:0;transition:transform .9s cubic-bezier(.2,1,.3,1),opacity .6s ease;max-width:310px;text-align:center}
.gletter::before{content:"";position:absolute;inset:7px;border:1px solid rgba(184,137,58,.5);pointer-events:none}
.gletter::after{content:"";position:absolute;inset:10px;border:1px solid rgba(184,137,58,.22);pointer-events:none}
.gletter small{display:block;font:600 10.5px/1 var(--body);letter-spacing:.32em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.gletter p{font-family:var(--hand);font-style:italic;font-size:clamp(27px,7.6vw,32px);font-weight:600;line-height:1.08;margin:0;text-wrap:balance}
.gletter span{display:block;font-family:var(--hand);font-style:italic;font-size:20px;color:#8A6A3A;margin-top:8px;text-align:right}
.gift.done .gletter{transform:rotate(-1.2deg);opacity:1}
.ghint{font-weight:600;color:var(--ink-2);letter-spacing:.3em;text-transform:uppercase;font-size:11px;margin:0;min-height:1.2em}
.gplay{border:1px solid var(--navy);border-radius:999px;padding:12px 30px;font:600 13px var(--body);letter-spacing:.22em;text-transform:uppercase;background:var(--navy);color:#F6F0E6;opacity:0;transition:opacity .4s ease .6s;cursor:pointer;margin-top:6px}
.gift.done .gplay{opacity:1}
.gpetals{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.gpetals i{position:absolute;top:-30px;width:9px;height:19px;border-radius:50% 50% 50% 50%/70% 70% 30% 30%;background:linear-gradient(180deg,#FFD84F,#E59A00);opacity:.75;animation:fall linear forwards}
.gpetals i.w{background:linear-gradient(180deg,#fff,#E7E3D6);width:7px;height:16px}
.gpetals i.b{background:linear-gradient(180deg,#7D97F2,#2D44B0);width:7px;height:12px}
@keyframes fall{from{transform:translateY(0) rotate(var(--r))}to{transform:translateY(110vh) rotate(calc(var(--r) + 540deg))}}

/* install guide */
.inst{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px 16px;opacity:0;transition:opacity .6s ease}
.inst.show{opacity:1}
.icard{position:relative;background:var(--grain),var(--paper);color:#2A2420;border-radius:4px;padding:26px 24px 20px;max-width:360px;width:100%;box-shadow:0 1px 1px rgba(0,0,0,.04),0 18px 40px rgba(40,30,15,.18);transform:translateY(18px);transition:transform .8s cubic-bezier(.2,1,.3,1)}
.inst.show .icard{transform:none}
.icard::before{content:"";position:absolute;inset:7px;border:1px solid rgba(184,137,58,.45);pointer-events:none}
.icard small{display:block;font:600 10.5px/1 var(--body);letter-spacing:.32em;text-transform:uppercase;color:var(--gold);text-align:center}
.icard h2{font-family:var(--hand);font-style:italic;font-weight:600;font-size:30px;line-height:1.1;margin:10px 0 6px;text-align:center;text-wrap:balance}
.icard .sub{font-size:14px;color:#6E5E48;text-align:center;margin:0 0 18px;line-height:1.45}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;font-size:15px;line-height:1.4}
.steps .n{font-family:var(--hand);font-style:italic;font-weight:600;font-size:24px;line-height:1;color:var(--gold);text-align:center}
.steps b{font-weight:700}
.ico{display:inline-block;vertical-align:-4px;width:18px;height:18px;margin:0 2px}
.tabs{display:flex;justify-content:center;gap:6px;margin:0 0 16px}
.tabs button{font:600 11px var(--body);letter-spacing:.18em;text-transform:uppercase;border:1px solid var(--line);background:transparent;color:#6E5E48;border-radius:999px;padding:6px 12px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#F6F0E6}
.iactions{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:20px}
.iactions .gplay{opacity:1;margin:0}
.linkish{border:0;background:none;font:500 13px var(--body);color:#8A7558;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px}
.inote{font-family:var(--hand);font-style:italic;font-size:22px;text-align:center;margin:14px 0 0;color:#2A2420}
</style>
</head>
<body>
<div id="app" class="page"><header class="titlepage"><div class="kicker">Groningen vs Vienna</div><h1>Loading</h1></header></div>
<script>
/* ---------- surprise for Laura (self-contained) ---------- */
(() => {
let ROOT = null, OPTS = {};

/* realistic-ish bouquet: sunflowers + field flowers, drawn as SVG */
function makeRand(seed) { let s = seed; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
function bouquetSVG() {
  const R = makeRand(20261110), f = n => n.toFixed(1);
  const TIE = [160, 335];
  const defs = `<defs>
<linearGradient id="pet" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#C96F00"/><stop offset=".35" stop-color="#F2A600"/><stop offset="1" stop-color="#FFD44A"/></linearGradient>
<linearGradient id="pet2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#D98400"/><stop offset=".5" stop-color="#FFC21F"/><stop offset="1" stop-color="#FFE27A"/></linearGradient>
<radialGradient id="sunc" cx=".45" cy=".4" r=".6"><stop offset="0" stop-color="#6B4318"/><stop offset=".55" stop-color="#3A220C"/><stop offset="1" stop-color="#22130A"/></radialGradient>
<linearGradient id="dp" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#DCD8CC"/><stop offset=".4" stop-color="#FAF9F4"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
<radialGradient id="dc" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#FFE98A"/><stop offset=".6" stop-color="#F2B521"/><stop offset="1" stop-color="#C98410"/></radialGradient>
<linearGradient id="corn" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#2639A8"/><stop offset="1" stop-color="#6E8DF2"/></linearGradient>
<radialGradient id="pop" cx=".5" cy=".7" r=".8"><stop offset="0" stop-color="#8E0E08"/><stop offset=".25" stop-color="#D3241A"/><stop offset=".8" stop-color="#F0442E"/><stop offset="1" stop-color="#FF6A4D"/></radialGradient>
<linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#2D5E24"/><stop offset=".6" stop-color="#4E8F3C"/><stop offset="1" stop-color="#78B25A"/></linearGradient>
<linearGradient id="kb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C69B63"/><stop offset="1" stop-color="#9C7240"/></linearGradient>
<linearGradient id="kl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EBCB98"/><stop offset=".7" stop-color="#D4AC72"/><stop offset="1" stop-color="#BF9258"/></linearGradient>
<linearGradient id="kr" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D2AA70"/><stop offset=".7" stop-color="#B98B52"/><stop offset="1" stop-color="#9E7442"/></linearGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#3A2208" flood-opacity=".25"/></filter>
</defs>`;
  const stem = (x, y, w, col) => { const mx = (x + TIE[0]) / 2 + (R() - .5) * 20, my = (y + TIE[1]) / 2 + 20; return `<path d="M${f(x)} ${f(y)} Q${f(mx)} ${f(my)} ${TIE[0] + (R() - .5) * 10} ${TIE[1]} L${f(154 + R() * 12)} 438" stroke="${col || "#4C7D34"}" stroke-width="${w}" fill="none" stroke-linecap="round"/>`; };
  const petal = (L, w) => `M0 0 C${f(w)} ${f(-L * .25)} ${f(w * .75)} ${f(-L * .85)} 0 ${f(-L)} C${f(-w * .75)} ${f(-L * .85)} ${f(-w)} ${f(-L * .25)} 0 0Z`;
  const sunflower = (cx, cy, r, rot, sy) => {
    let s = `<g transform="translate(${cx} ${cy}) rotate(${rot}) scale(1 ${sy})" filter="url(#soft)">`;
    [[22, 1.0, "pet", 0], [20, .9, "pet2", 9]].forEach(([n, k, g, off]) => {
      for (let i = 0; i < n; i++) { const a = i * 360 / n + off + (R() - .5) * 8, L = r * k * (.9 + R() * .25); s += `<path d="${petal(L, r * .17)}" fill="url(#${g})" transform="rotate(${f(a)}) translate(0 ${f(-r * .3)})"/>`; }
    });
    s += `<circle r="${f(r * .44)}" fill="url(#sunc)"/>`;
    for (let i = 0; i < 70; i++) { const a = i * 2.39996, d = Math.sqrt(i / 70) * r * .4; s += `<circle cx="${f(Math.cos(a) * d)}" cy="${f(Math.sin(a) * d)}" r="${f(r * .022 + R() * r * .01)}" fill="${i % 3 ? "#7A4C1F" : "#A06A2C"}" opacity=".85"/>`; }
    return s + `<ellipse cx="${f(-r * .12)}" cy="${f(-r * .14)}" rx="${f(r * .16)}" ry="${f(r * .1)}" fill="#fff" opacity=".08"/></g>`;
  };
  const daisy = (cx, cy, r, rot, sy) => {
    let s = `<g transform="translate(${cx} ${cy}) rotate(${rot}) scale(1 ${sy})" filter="url(#soft)">`;
    for (let i = 0; i < 22; i++) { const a = i * 360 / 22 + (R() - .5) * 6; s += `<path d="${petal(r * (.95 + R() * .15), r * .13)}" fill="url(#dp)" transform="rotate(${f(a)}) translate(0 ${f(-r * .22)})"/>`; }
    return s + `<circle r="${f(r * .3)}" fill="url(#dc)"/></g>`;
  };
  const cornflower = (cx, cy, r, rot) => {
    let s = `<g transform="translate(${cx} ${cy}) rotate(${rot})" filter="url(#soft)">`;
    for (let i = 0; i < 11; i++) { const a = i * 360 / 11 + (R() - .5) * 10, L = r * (.9 + R() * .2); s += `<path d="M0 0 L${f(-r * .16)} ${f(-L * .55)} L${f(-r * .3)} ${f(-L)} L${f(-r * .1)} ${f(-L * .88)} L0 ${f(-L * 1.02)} L${f(r * .1)} ${f(-L * .88)} L${f(r * .3)} ${f(-L)} L${f(r * .16)} ${f(-L * .55)}Z" fill="url(#corn)" transform="rotate(${f(a)})"/>`; }
    return s + `<circle r="${f(r * .22)}" fill="#1E2A6E"/></g>`;
  };
  const poppy = (cx, cy, r, rot) => {
    let s = `<g transform="translate(${cx} ${cy}) rotate(${rot}) scale(1 .88)" filter="url(#soft)">`;
    [[-.38, -.2], [.38, -.2], [-.3, .3], [.3, .3]].forEach(([dx, dy], i) => s += `<ellipse cx="${f(dx * r)}" cy="${f(dy * r)}" rx="${f(r * .66)}" ry="${f(r * .6)}" fill="url(#pop)" transform="rotate(${i * 20 - 30} ${f(dx * r)} ${f(dy * r)})" opacity=".97"/>`);
    s += `<circle r="${f(r * .26)}" fill="#1A1410"/>`;
    for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; s += `<circle cx="${f(Math.cos(a) * r * .34)}" cy="${f(Math.sin(a) * r * .34)}" r="${f(r * .05)}" fill="#2A2018"/>`; }
    return s + `<circle r="${f(r * .12)}" fill="#7C8A5A"/></g>`;
  };
  const lavender = (x, y, len, ang) => {
    const dx = Math.sin(ang * Math.PI / 180), dy = -Math.cos(ang * Math.PI / 180); let s = "";
    for (let i = 0; i < 14; i++) { const t = i / 14, px = x + dx * len * t, py = y + dy * len * t, side = i % 2 ? 1 : -1; s += `<ellipse cx="${f(px + side * 3.2)}" cy="${f(py)}" rx="3.2" ry="5" fill="${i % 3 ? "#8C6BD0" : "#6B4BB4"}" transform="rotate(${f(ang + side * 25)} ${f(px + side * 3.2)} ${f(py)})"/>`; }
    return s;
  };
  const wheat = (x, y, len, ang) => {
    const dx = Math.sin(ang * Math.PI / 180), dy = -Math.cos(ang * Math.PI / 180); let s = "";
    for (let i = 0; i < 12; i++) {
      const t = i / 12, px = x + dx * len * t, py = y + dy * len * t, side = i % 2 ? 1 : -1, gx = px + side * 3.5, gy = py;
      s += `<line x1="${f(gx)}" y1="${f(gy)}" x2="${f(gx + side * 6 + dx * 10)}" y2="${f(gy + dy * 14)}" stroke="#C9A04A" stroke-width=".8"/>`;
      s += `<ellipse cx="${f(gx)}" cy="${f(gy)}" rx="3.4" ry="6" fill="${i % 3 ? "#DDB04F" : "#C8963A"}" transform="rotate(${f(ang + side * 22)} ${f(gx)} ${f(gy)})"/>`;
    }
    return s;
  };
  const gyps = (x, y) => { let s = ""; for (let i = 0; i < 9; i++) { const a = R() * Math.PI * 2, d = 6 + R() * 16, px = x + Math.cos(a) * d, py = y + Math.sin(a) * d * .8; s += `<line x1="${x}" y1="${y + 8}" x2="${f(px)}" y2="${f(py)}" stroke="#7E9B66" stroke-width=".8"/><circle cx="${f(px)}" cy="${f(py)}" r="${f(2 + R() * 1.4)}" fill="#FFFFFF" stroke="#E6E2D6" stroke-width=".5"/>`; } return s; };
  const leaf = (x, y, L, rot) => `<g transform="translate(${x} ${y}) rotate(${rot})"><path d="M0 0 C${f(L * .45)} ${f(-L * .2)} ${f(L * .4)} ${f(-L * .8)} 0 ${f(-L)} C${f(-L * .4)} ${f(-L * .8)} ${f(-L * .45)} ${f(-L * .2)} 0 0Z" fill="url(#leaf)"/><path d="M0 0 L0 ${f(-L * .95)}" stroke="#2A5220" stroke-width="1.2" opacity=".6"/></g>`;

  const SUN = [[160, 104, 42, 4, .96], [100, 158, 35, -16, .88], [222, 156, 35, 14, .9], [160, 212, 31, -4, .82]];
  const DAISY = [[56, 140, 15, -20, .9], [266, 136, 15, 18, .9], [114, 222, 14, -8, .85], [208, 226, 14, 10, .85], [212, 82, 12, 20, .9]];
  const CORN = [[44, 186, 12, -30], [280, 182, 12, 30], [128, 70, 11, -10], [70, 104, 10, -25], [252, 102, 10, 25]];
  const POP = [[96, 92, 17, -15], [244, 216, 16, 20], [62, 214, 15, -10]];
  const LAV = [[38, 132, 60, -32], [282, 128, 60, 32], [86, 64, 56, -18], [236, 60, 56, 18]];
  const WHEAT = [[108, 46, 46, -12], [210, 40, 46, 12], [160, 34, 40, 0], [28, 96, 42, -40], [292, 90, 42, 40]];
  const GYP = [[70, 126], [252, 152], [140, 158], [186, 64], [40, 160], [290, 160]];

  let back = `<path d="M18 178 Q160 128 302 172 L214 338 L106 338Z" fill="url(#kb)"/><path d="M18 178 Q160 128 302 172" stroke="#E7C995" stroke-width="2" fill="none" opacity=".6"/>`;
  let stems = "";
  [...WHEAT, ...LAV].forEach(([x, y, l, a]) => stems += stem(x, y, 1.8, "#7C8F48"));
  [...CORN, ...POP, ...DAISY].forEach(([x, y]) => stems += stem(x, y, 2, "#567F3A"));
  SUN.forEach(([x, y]) => stems += stem(x, y + 10, 4.5, "#4A7A32"));
  const leaves = leaf(70, 262, 58, -58) + leaf(252, 258, 58, 58) + leaf(48, 226, 44, -78) + leaf(274, 222, 44, 76) + leaf(130, 252, 40, -24) + leaf(194, 254, 40, 26);
  let heads = "";
  WHEAT.forEach(w => heads += wheat(...w));
  LAV.forEach(l => heads += lavender(...l));
  GYP.forEach(g => heads += gyps(...g));
  CORN.forEach(c => heads += cornflower(...c));
  DAISY.forEach(d => heads += daisy(...d));
  POP.forEach(p => heads += poppy(...p));
  [...SUN].sort((a, b) => a[1] - b[1]).forEach(s => heads += sunflower(...s));
  const stubs = [148, 154, 160, 166, 172].map(x => `<path d="M${x} 420 L${x + (R() - .5) * 6} 442" stroke="#5E8A43" stroke-width="3.2" stroke-linecap="round"/>`).join("");
  const front = `<path d="M62 240 Q112 246 166 268 L152 430Z" fill="url(#kl)"/>
<path d="M258 236 Q210 248 156 268 L170 430Z" fill="url(#kr)"/>
<path d="M62 240 Q112 246 166 268" stroke="#F3DDB4" stroke-width="2" fill="none" opacity=".8"/>
<path d="M90 262 Q118 300 140 360" stroke="#B48850" stroke-width="1" fill="none" opacity=".55"/><path d="M226 262 Q200 310 176 370" stroke="#8E663A" stroke-width="1" fill="none" opacity=".5"/><path d="M118 258 Q132 300 146 330" stroke="#F0D7AA" stroke-width="1.2" fill="none" opacity=".6"/>`;
  const twine = `<path d="M118 334 Q160 346 204 334" stroke="#8A6B45" stroke-width="3" fill="none"/><path d="M118 339 Q160 351 204 339" stroke="#A88458" stroke-width="2" fill="none"/>
<path d="M160 342 C138 318 118 330 132 346 C140 354 152 348 160 342Z" fill="none" stroke="#8A6B45" stroke-width="3"/><path d="M160 342 C182 318 202 330 188 346 C180 354 168 348 160 342Z" fill="none" stroke="#8A6B45" stroke-width="3"/>
<path d="M158 344 Q150 366 142 382" stroke="#8A6B45" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M162 344 Q172 364 178 380" stroke="#8A6B45" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="160" cy="342" r="4.5" fill="#7A5C38"/>`;
  return `<svg viewBox="0 0 320 450" class="bouquet" role="img" aria-label="A bouquet of sunflowers and wild flowers">${defs}${back}${stems}${leaves}${heads}${stubs}${front}${twine}</svg>`;
}

function bowSVG() {

/* ---------- local adapter (this phone only) ---------- */
function localAdapter() {
  const KEY = "duel-v2"; let db, me = null; const subs = { players: [], matches: [], qs: [] }, authSubs = [];
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { toast("Storage is full, change not saved"); } };
  const emit = () => {
    subs.players.forEach(f => f(structuredClone(db.players)));
    subs.matches.forEach(([u, f]) => f(Object.entries(db.matches).filter(([, m]) => m.players.includes(u)).map(([id, m]) => ({ id, ...structuredClone(m) }))));
    subs.qs.forEach(f => f(Object.entries(db.qs).map(([id, q]) => ({ id, ...q }))));
  };
  const sub = (list, item) => { list.push(item); return () => { const i = list.indexOf(item); if (i >= 0) list.splice(i, 1); }; };
  return {
    mode: "local",
    async init() {
      db = store.get(KEY, null) || { players: {}, matches: {}, qs: {} };
      try { me = sessionStorage.getItem("duel-me") || null; } catch (e) {}
      if (me && !db.players[me]) me = null;
    },
    user: () => me ? { uid: me } : null,
    onAuth(f) { authSubs.push(f); },
    use(u) { me = u; try { sessionStorage.setItem("duel-me", u || ""); } catch (e) {} authSubs.forEach(f => f(u ? { uid: u } : null)); },
    async newPlayer(d) { const u = uid8(); db.players[u] = d; save(); emit(); return u; },
    watchPlayers(f) { const un = sub(subs.players, f); f(structuredClone(db.players)); return un; },
    async savePlayer(u, d) { db.players[u] = { ...(db.players[u] || {}), ...d }; save(); emit(); },
    watchMatches(u, f) { const un = sub(subs.matches, [u, f]); emit(); return un; },
    createMatch(d, id) { const k = id || uid8(); if (!db.matches[k]) db.matches[k] = d; save(); setTimeout(emit); return k; },
    async saveAnswers(mid, u, arr) { (db.matches[mid].answers ||= {})[u] = arr; save(); emit(); },
    async deleteMatch(mid) { delete db.matches[mid]; save(); emit(); },
    watchQs(f) { const un = sub(subs.qs, f); emit(); return un; },
    async addQ(d) { db.qs[uid8()] = d; save(); emit(); },
    async delQ(k) { delete db.qs[k]; save(); emit(); }
  };
}

async function firebaseAdapter(cfg) {
  const V = "10.12.2", base = "https://www.gstatic.com/firebasejs/" + V + "/";
  const [{ initializeApp }, A, F] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")]);

  return {
    mode: "cloud",
    async init() {
      await new Promise(r => { const u = A.onAuthStateChanged(auth, () => { u(); r(); }); });
      if (!auth.currentUser) { try { await A.signInAnonymously(auth); } catch (e) { toast("Could not connect: " + e.code); } }
      who = store.get("duel-who", null);
      try { const d = await F.getDoc(F.doc(fs, "trivia_members", auth.currentUser.uid)); who = d.exists() ? d.data().who : null; } catch (e) { if (e.code === "permission-denied") who = null; }
      store.set("duel-who", who);
    },
    user: () => who ? { uid: who } : null,
    onAuth(f) { authSubs.push(f); },
    async join(code, w) {
      if (!auth.currentUser) await A.signInAnonymously(auth);
      await F.setDoc(F.doc(fs, "trivia_members", auth.currentUser.uid), { code, who: w, joined: Date.now() });
      who = w; store.set("duel-who", w); authSubs.forEach(f => f({ uid: w }));
    },
    async signOut() {
      try { await F.deleteDoc(F.doc(fs, "trivia_members", auth.currentUser.uid)); } catch (e) {}
      who = null; store.set("duel-who", null); authSubs.forEach(f => f(null));
    },
    watchPlayers(f) { return F.onSnapshot(col("trivia_players"), s => { const o = {}; s.forEach(d => o[d.id] = d.data()); f(o); }, e => { if (e.code === "permission-denied") { denied = true; render(); } else toast("Could not load players: " + e.code); }); },
    savePlayer: (u, d) => F.setDoc(F.doc(fs, "trivia_players", u), d, { merge: true }),
    watchMatches(u, f) { return F.onSnapshot(F.query(col("trivia_matches"), F.where("players", "array-contains", u)), s => f(s.docs.map(d => ({ id: d.id, ...d.data() }))), fail("duels")); },
    createMatch(d, id) { const ref = id ? F.doc(fs, "trivia_matches", id) : F.doc(col("trivia_matches")); F.setDoc(ref, d, id ? { merge: true } : {}).catch(e => toast("Duel not saved: " + e.code)); return ref.id; },
    saveAnswers: (mid, u, arr) => F.updateDoc(F.doc(fs, "trivia_matches", mid), { ["answers." + u]: arr }),
    deleteMatch: mid => F.deleteDoc(F.doc(fs, "trivia_matches", mid)),
    watchQs(f) { return F.onSnapshot(col("trivia_questions"), s => f(s.docs.map(d => ({ id: d.id, ...d.data() }))), fail("your questions")); },
    addQ: d => F.addDoc(col("trivia_questions"), d),
    delQ: k => F.deleteDoc(F.doc(fs, "trivia_questions", k))
  };

    mount(topbar(leave), board(), h("div", { class: "panel handoff" }, h("span", { class: "label" }, "Pass the phone to"), h("span", { class: "who", style: { color: G.colors[p] } }, G.names[p]),
      h("button", { class: "btn primary", type: "button", id: "ready", onclick: ask }, "I'm ready")));
    document.getElementById("ready").focus(); };
  const ask = () => { const p = G.i % 2;
    mount(topbar(leave), board(), questionCard({ q: G.list[G.i], idx: Math.floor(G.i / 2), total: G.list.length / 2, label: G.names[p] + "'s turn", color: G.colors[p], timer: G.timer,
      onDone: (res, next) => { G.score[p] += res.pts; if (res.ok) G.right[p]++; document.getElementById("lsc" + p).textContent = G.score[p];
        const last = G.i + 1 >= G.list.length; next.textContent = last ? "See results" : "Pass to " + G.names[1 - p]; next.onclick = () => { G.i++; last ? end() : handoff(); }; } })); };
  const end = () => { const [a, b] = G.score;
    mount(topbar(() => go("/")), h("div", { class: "banner", style: { color: a === b ? "var(--ink)" : G.colors[a > b ? 0 : 1] } }, a === b ? "It's a tie!" : G.names[a > b ? 0 : 1] + " wins!"),
      h("div", { class: "board" }, ...[0, 1].flatMap(p => { const el = h("div", { class: "pl" + (p ? " r" : ""), style: { "--c": G.colors[p] } }, h("span", { class: "nm" }, G.names[p]), h("span", { class: "sc" }, G.score[p]), h("span", { class: "faint", style: { "font-size": "13px" } }, G.right[p] + " of " + G.list.length / 2 + " right")); return p ? [h("div", { class: "mid" }, "final"), el] : [el]; })),
      h("div", { class: "actions" }, h("button", { class: "btn primary", type: "button", onclick: () => startLocal(G.names, G.colors, pickQs(CATS, G.list.length, new Set()), G.timer) }, "Rematch"), h("button", { class: "btn", type: "button", onclick: () => { ui.busy = false; render(); } }, "Change settings"))); };
  handoff();
}

/* ---------- sign in, new player ---------- */
function renderAuth() {
  let w = GIFT_LINK ? "laura" : null;
  const pick = h("div", { class: "two" }), msg = h("div", { class: "status", role: "status" });
  const drawPick = () => pick.replaceChildren(...[["jacopo", "Jacopo", COLORS[0]], ["laura", "Laura", COLORS[1]]].map(([id, name, c]) =>
    h("button", { class: "whobtn", type: "button", style: { "--c": c }, "aria-pressed": String(w === id), onclick: () => { w = id; drawPick(); code.focus(); } }, h("span", { class: "av", style: { "--c": c } }, name[0]), name)));
  const code = h("input", { type: "password", id: "join-code", autocomplete: "off", required: true, placeholder: "Your secret code" });
  const btn = h("button", { class: "btn primary", type: "submit" }, "Let me in");
  const submit = async e => {
    e.preventDefault();
    if (!w) { msg.textContent = "Tap who you are first."; return; }
    btn.disabled = true; msg.textContent = "Checking";
    try { await DB.join(code.value.trim(), w); }
    catch (err) { msg.textContent = err.code === "permission-denied" ? "That code is not right." : err.code === "auth/operation-not-allowed" ? "Anonymous sign-in is not switched on in Firebase yet." : "Could not join: " + (err.code || err.message); btn.disabled = false; }
  };
  drawPick();
  mount(
    h("header", { class: "titlepage" }, h("div", { class: "kicker" }, "Private game"), h("h1", {}, h("span", { class: "a" }, "Groningen"), " vs ", h("span", { class: "b" }, "Vienna")), h("p", {}, "A private game for Jacopo and Laura. No email needed, just your secret code.")),
    h("form", { class: "panel", onsubmit: submit }, h("span", { class: "label" }, "Who are you?"), pick, field("Secret code", code), btn, msg,
      h("p", { class: "faint", style: { "font-size": "13px" } }, "You only do this once on each phone.")));
}
function playerForm(title, sub, onSave) {
  const name = h("input", { type: "text", id: "np-name", required: true, maxlength: 20, placeholder: "Your name", value: ({ jacopo: "Jacopo", laura: "Laura" })[myUid()] || "" });
  const taken = Object.values(players).map(p => p.color);
  let color = COLORS.find(c => !taken.includes(c)) || COLORS[0];
  const sw = h("div", { class: "swatches" });
  const drawSw = () => sw.replaceChildren(...COLORS.map(c => h("button", { class: "sw", type: "button", style: { "--c": c }, "aria-label": "Colour " + c, "aria-pressed": String(c === color), onclick: () => { color = c; drawSw(); } })));
  drawSw();
  return h("form", { class: "panel", onsubmit: e => { e.preventDefault(); onSave({ name: name.value.trim(), color, created: Date.now() }); } },
    h("h2", {}, title), sub ? h("p", { class: "muted" }, sub) : null, field("Name", name), h("div", { class: "field" }, h("span", {}, "Your colour"), sw), h("button", { class: "btn primary", type: "submit" }, "Continue"));
}
function renderPrivate() {
  mount(h("header", { class: "titlepage" }, h("div", { class: "kicker" }, "Groningen vs Vienna"), h("h1", {}, "Private game"),
      h("p", {}, "This phone is not unlocked yet. Enter the secret code again.")),
    h("div", { class: "actions" }, h("button", { class: "btn primary", type: "button", onclick: () => DB.signOut() }, "Enter the code")));
}
function renderNewPlayer() {
  mount(h("header", { class: "titlepage" }, h("div", { class: "kicker" }, "Welcome"), h("h1", {}, "Pick your player")),
    playerForm("What should we call you?", "This is the name your rival sees.", async d => { await DB.savePlayer(myUid(), d); }));
}
function renderWho() {
  const list = Object.entries(players).sort((a, b) => a[1].created - b[1].created);
  mount(h("header", { class: "titlepage" }, h("div", { class: "kicker" }, "Groningen vs Vienna"), h("h1", {}, list.length ? "Who's playing?" : "Pick your player"), h("p", {}, "Sync is off, so players live on this phone.")),
    list.length ? h("div", { class: "who-list" }, list.map(([u]) => h("button", { class: "drow", type: "button", onclick: () => DB.use(u) }, avatar(u), h("div", { class: "dmain" }, h("b", {}, pName(u)))))) : null,
    playerForm(list.length ? "Add a player" : "What should we call you?", null, async d => { const u = await DB.newPlayer(d); DB.use(u); }));
}

/* ---------- router ---------- */
function render() {
  const r = location.hash.slice(1) || "/";
  if (ui.busy && (r.startsWith("/play/") || r === "/local")) return;
  ui.busy = false; clearInterval(ui.tick); ui.pick = null;
  if (r !== ui.lastRoute) { ui.lastRoute = r; window.scrollTo(0, 0); }
  if (!user) { document.body.classList.remove("withtabs"); return DB.mode === "local" ? renderWho() : renderAuth(); }
  if (denied) { document.body.classList.remove("withtabs"); return renderPrivate(); }
  if (!playersLoaded) { document.body.classList.remove("withtabs"); return mount(h("header", { class: "titlepage" }, h("div", { class: "kicker" }, "Groningen vs Vienna"), h("h1", {}, "Loading"))); }
  if (!players[user.uid]) { document.body.classList.remove("withtabs"); return renderNewPlayer(); }
  if (r.startsWith("/play/")) { document.body.classList.remove("withtabs"); return renderPlay(r.slice(6)); }
  if (r === "/local") return renderLocal();
  document.body.classList.add("withtabs"); drawTabs(r);
  if (r.startsWith("/duel/")) return renderDuel(r.slice(6));
  if (r === "/duels") return renderDuels();
  if (r === "/us") return renderUs();
  if (r === "/me") return renderMe();
  return renderHome();
}
function go(path) { if (location.hash.slice(1) === path) render(); else location.hash = path; }
window.addEventListener("hashchange", () => { if (ui.busy) { ui.busy = false; clearInterval(ui.tick); ui.pick = null; } render(); });
let rT; const soon = () => { clearTimeout(rT); rT = setTimeout(() => { if (!ui.busy) render(); }, 30); };
function subscribe() {
  unsubs.forEach(f => { try { f?.(); } catch (e) {} }); unsubs = []; matches = []; qs = []; denied = false; playersLoaded = false;
  if (DB.mode === "local") unsubs.push(DB.watchPlayers(p => { players = p; playersLoaded = true; soon(); }));
  if (!user) return;
  if (DB.mode !== "local") unsubs.push(DB.watchPlayers(p => { players = p; playersLoaded = true; soon(); }));
  unsubs.push(DB.watchMatches(user.uid, m => { matches = m; soon(); }), DB.watchQs(q => { qs = q; soon(); }));
}

/* ---------- boot ---------- */
const GIFT_LINK = /(^|&)laura(=|&|$)/.test(location.search.slice(1));
if (GIFT_LINK && !store.get("duel-gift-seen", false) && !window.giftIsStandalone()) window.openGift({ onDone: () => store.set("duel-gift-seen", true) });
(async () => {
  try { DB = FIREBASE_CONFIG ? await firebaseAdapter(FIREBASE_CONFIG) : localAdapter(); }
  catch (e) { DB = localAdapter(); setTimeout(() => toast("Sync is unreachable, playing on this phone only"), 500); }
  await DB.init();
  user = DB.user();
  DB.onAuth(u => { const was = user?.uid; user = u; if (was !== u?.uid) { subscribe(); render(); } });
  subscribe(); render();
})();

/* ---------- pull down to update ---------- */
(() => {
  const ind = h("div", { class: "ptr", "aria-hidden": "true" }, h("span", {}, "↻")); document.body.append(ind);
  let y0 = null, dy = 0, busy = false;
  const ready = () => !busy && !ui.busy && window.scrollY <= 0 && !document.querySelector(".scrim");
  addEventListener("touchstart", e => { y0 = ready() && e.touches.length === 1 ? e.touches[0].clientY : null; dy = 0; ind.style.transition = "none"; }, { passive: true });
  addEventListener("touchmove", e => { if (y0 == null) return; dy = e.touches[0].clientY - y0; if (dy <= 0 || window.scrollY > 0) { ind.style.transform = "translate(-50%,-70px)"; return; } const d = Math.min(dy * 0.5, 90); ind.style.transform = "translate(-50%," + (d - 60) + "px)"; ind.firstChild.style.transform = "rotate(" + dy * 2 + "deg)"; ind.style.opacity = Math.min(1, dy / 120); }, { passive: true });
  addEventListener("touchend", async () => {
    if (y0 == null) return; y0 = null; ind.style.transition = "transform .2s ease";
    if (dy < 140 || window.scrollY > 0) { ind.style.transform = "translate(-50%,-70px)"; return; }
    busy = true; ind.style.transform = "translate(-50%,24px)"; ind.firstChild.style.transform = ""; ind.classList.add("spin");
    try { const reg = await navigator.serviceWorker?.getRegistration(); await reg?.update(); } catch (e) {}
    setTimeout(() => location.reload(), 300);
  });
})();
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});
